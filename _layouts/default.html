<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111615" media="(prefers-color-scheme: dark)">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script>
      document.documentElement.className = 'js';
      try {
        var savedTheme = localStorage.getItem('agent-security-theme');
        if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#paper-catalog">Skip to paper catalog</a>
    {{ content }}
    <script src="{{ '/assets/js/catalog.js' | relative_url }}" defer></script>
  </body>
</html>
